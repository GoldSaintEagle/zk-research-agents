[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptomath"
version = "0.1.0"
description = "Readable, toy-scale math library for zero-knowledge proof research: algebra (fields, polynomials, NTT), toy proof-system components (MLE, sum-check, Merkle, FRI, KZG algebra, permutation/lookup arguments, R1CS/Plonkish), an op-counting cost model with ZK primitive formulas, AO-primitive costs, commitments/Fiat-Shamir and small EC groups. NOT for production use."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "sympy"]
license = {text = "MIT"}

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptomath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
